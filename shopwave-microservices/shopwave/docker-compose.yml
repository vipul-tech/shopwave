version: '3.8'

services:

  # ── MySQL databases (one per service) ─────────────────────────────────────
  mysql-users:
    image: mysql:8.0
    container_name: shopwave-users-db
    environment:
      MYSQL_ROOT_PASSWORD: shopwave123
      MYSQL_DATABASE: users_db
    ports:
      - "3307:3306"
    volumes:
      - users_data:/var/lib/mysql
    networks: [shopwave-net]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql-products:
    image: mysql:8.0
    container_name: shopwave-products-db
    environment:
      MYSQL_ROOT_PASSWORD: shopwave123
      MYSQL_DATABASE: products_db
    ports:
      - "3308:3306"
    volumes:
      - products_data:/var/lib/mysql
    networks: [shopwave-net]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql-orders:
    image: mysql:8.0
    container_name: shopwave-orders-db
    environment:
      MYSQL_ROOT_PASSWORD: shopwave123
      MYSQL_DATABASE: orders_db
    ports:
      - "3309:3306"
    volumes:
      - orders_data:/var/lib/mysql
    networks: [shopwave-net]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── LocalStack (AWS SQS emulation locally) ────────────────────────────────
  localstack:
    image: localstack/localstack:3.0
    container_name: shopwave-localstack
    environment:
      SERVICES: sqs,ses,s3
      DEFAULT_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - ./infrastructure/scripts/localstack-init.sh:/etc/localstack/init/ready.d/init.sh
      - localstack_data:/var/lib/localstack
    networks: [shopwave-net]

  # ── Spring Boot microservices ─────────────────────────────────────────────
  user-service:
    build: ./user-service
    container_name: shopwave-user-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-users:3306/users_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: shopwave123
      JWT_SECRET: mySecretKeyForShopWaveJWT2024MustBe256BitsLong
      JWT_EXPIRATION: 86400000
    depends_on:
      mysql-users:
        condition: service_healthy
    networks: [shopwave-net]

  product-service:
    build: ./product-service
    container_name: shopwave-product-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-products:3306/products_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: shopwave123
      JWT_SECRET: mySecretKeyForShopWaveJWT2024MustBe256BitsLong
    depends_on:
      mysql-products:
        condition: service_healthy
    networks: [shopwave-net]

  order-service:
    build: ./order-service
    container_name: shopwave-order-service
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-orders:3306/orders_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: shopwave123
      JWT_SECRET: mySecretKeyForShopWaveJWT2024MustBe256BitsLong
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_ORDER_QUEUE: http://localstack:4566/000000000000/order-events
      PRODUCT_SERVICE_URL: http://product-service:8082
    depends_on:
      mysql-orders:
        condition: service_healthy
      localstack:
        condition: service_started
    networks: [shopwave-net]

  notification-service:
    build: ./notification-service
    container_name: shopwave-notification-service
    ports:
      - "8084:8084"
    environment:
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_ORDER_QUEUE: http://localstack:4566/000000000000/order-events
      MAIL_FROM: noreply@shopwave.com
    depends_on:
      localstack:
        condition: service_started
    networks: [shopwave-net]

volumes:
  users_data:
  products_data:
  orders_data:
  localstack_data:

networks:
  shopwave-net:
    driver: bridge
