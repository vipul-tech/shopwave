server:
  port: 8083
  servlet:
    context-path: /api

spring:
  application:
    name: order-service
  datasource:
    # For AWS RDS, replace with RDS endpoint
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:orders_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
#  datasource:
#    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/orders_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
#    username: ${SPRING_DATASOURCE_USERNAME:root}
#    password: ${SPRING_DATASOURCE_PASSWORD:root}
#    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        default_batch_fetch_size: 20
#  jpa:
#    hibernate:
#      ddl-auto: validate
#    show-sql: false
#    properties:
#      hibernate:
#        dialect: org.hibernate.dialect.MySQL8Dialect
#  flyway:
#    enabled: true
#    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:mySecretKeyForShopWaveJWT2024MustBe256BitsLong}

aws:
  region: ${AWS_REGION:us-east-1}
  endpoint-url: ${AWS_ENDPOINT_URL:}   # Set to http://localhost:4566 for LocalStack
  sqs:
    order-queue-url: ${SQS_ORDER_QUEUE:http://localhost:4566/000000000000/order-events}

services:
  product-service-url: ${PRODUCT_SERVICE_URL:http://localhost:8082/api}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.shopwave: DEBUG
